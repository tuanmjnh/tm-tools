appId: com.tm.tools
productName: TM Tools
directories:
  output: release
  buildResources: public
publish:
  provider: github
  owner: tuanmjnh
  repo: tm-tools-public
  releaseType: release
files:
  - electron/**/*
  - shared/**/*
  - .output/**/*
  - public/icon.ico
  - public/icon.png
  - package.json
asarUnpack:
  - .output/server/**
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*.exe"
      - "**/*.json"
      - "**/*.node"
win:
  icon: public/icon.ico
  executableName: TM Tools
  target:
    - nsis
nsis:
  oneClick: false
  installerIcon: public/icon.ico
  uninstallerIcon: public/icon.ico
  installerHeaderIcon: public/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
linux:
  icon: public/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
npmRebuild: false
