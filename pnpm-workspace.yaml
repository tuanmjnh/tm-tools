packages:
  - packages/*

allowBuilds:
  '@firebase/util': true
  electron-winstaller: true
  esbuild: true
  maplibre-gl: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - tm-hub-client@1.0.1 || 1.0.2

onlyBuiltDependencies:
  - '@firebase/util'
  - electron-winstaller
  - esbuild
  - maplibre-gl
  - protobufjs
  - unrs-resolver
  - vue-demi

overrides:
  source-map: 0.6.1
