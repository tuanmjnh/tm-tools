packages:
  - packages/*

allowBuilds:
  '@firebase/util': true
  better-sqlite3: false
  electron-winstaller: true
  esbuild: true
  maplibre-gl: true
  protobufjs: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - tm-hub-client@1.0.1 || 1.0.2 || 1.0.3 || 1.0.4 || 1.0.6 || 1.0.7
  - electron@44.9.0 || 44.9.1
  - '@nuxt/image@2.2.0'

overrides:
  source-map: 0.6.1
